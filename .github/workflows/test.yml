name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check + build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Smoke test (help output)
        run: node dist/index.js --help

      - name: Smoke test (methods listing needs API key, so just check no-creds path)
        env:
          # Strip any inherited LASTFM_* vars so the wrapper hits its no-creds branch
          LASTFM_API_KEY: ''
          LASTFM_BASE_URL: ''
        run: |
          node dist/index.js 2>&1 | grep -q "Namespaces:" || (echo "FAIL: help text missing" && exit 1)
          node dist/index.js artist getInfo artist=Radiohead 2>&1 | grep -q "LASTFM_API_KEY is not set" || (echo "FAIL: no-creds error missing" && exit 1)